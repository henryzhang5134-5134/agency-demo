<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fae8d0"><meta name="description" content="《钱包去哪了》：和小白熊整理旅行箱，找回钱包里的委托书，开启你的经营故事。"><title>钱包去哪了</title><link rel="preload" as="image" href="/video/completion-poster.jpg"><link rel="preload" as="image" href="/art/game-v2/welcome-backplate-v3.png"><link rel="preload" as="image" href="/art/game-v2/wallet-commission.png"></head>
<body><main id="shell"><div id="game">
 <div id="environment"><div id="video-stage" aria-label="白熊委托人"><video id="bear-video-a" src="/video/mobile/arrival.mp4" poster="/video/arrival-poster.jpg" preload="auto" autoplay muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5-page" x5-video-player-fullscreen="false" disablepictureinpicture></video><video id="bear-video-b" preload="none" muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5-page" x5-video-player-fullscreen="false" disablepictureinpicture></video></div>
 <div id="ground-art" aria-hidden="true"></div></div>
 <header id="header"><button id="pause" aria-label="暂停游戏"><img src="/art/pause.png" alt=""></button><h1>请找到钱包</h1><span class="time" id="timer" aria-label="倒计时">9:59</span></header>
 <button id="demo-complete" type="button" aria-label="一键通关，Demo 演示" title="一键通关 · Demo 演示" disabled>通</button>
 <button id="demo-restart" type="button" aria-label="一键重开本局，保留已获奖励" title="一键重开 · Demo 演示" disabled>重</button>
 <div id="speech" role="log" aria-label="白熊与玩家的对话" aria-live="polite" aria-relevant="additions"><div id="chat-stream"></div></div>
 <div id="like-stream" aria-hidden="true"></div>
 <div id="playfield" data-opening="closed"><div id="case-art"></div><div id="pile" aria-label="旅行箱里的三消物件"></div><div id="case-front"></div><img id="case-lid" src="/art/game-v2/case-lid.png" alt="尚未打开的旅行箱" draggable="false" fetchpriority="high">
 <div id="hint" role="status">点选 3 台相机，试试整理。</div></div>
 <section id="tray" aria-label="七格暂存槽和任务目标格"><div id="slots"></div><div id="target" role="status" aria-label="目标：找到小白熊的钱包和里面的委托书"><img id="commission-thumb" src="/art/game-v2/wallet-commission.png" alt="钱包里的委托书"><span id="target-status">寻找中</span></div><p id="progress">已归好 <b>0 / 32</b> 组</p></section>
 <nav id="props" aria-label="后续开放的道具"><button class="prop remove" aria-label="移出，后续开放" aria-disabled="true"></button><button class="prop match" aria-label="凑齐，后续开放" aria-disabled="true"></button><button class="prop shuffle" aria-label="打乱，后续开放" aria-disabled="true"></button></nav>
 <div id="toast" role="status"></div>
 <div id="door-light"></div>
 <div id="loading"><div class="loading-card"><span class="eyebrow">第一份委托</span><h2>好东西，值得找回来。</h2><p id="loading-copy">正在准备旅行箱…</p><div class="load-track"><i id="load-fill"></i></div><small>手工小世界，即将开门</small></div></div>
 <dialog id="dialog"><div id="dialog-body"></div></dialog>
 <div id="choices"></div>
 </div></main><script type="module" src="/src/game.ts"></script></body></html>
